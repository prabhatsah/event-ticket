spring:
  application:
    name: event-ticket-booking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

