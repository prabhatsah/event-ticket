apiVersion: apps/v1
kind: Deployment

metadata:
  name: event-booking-api
  namespace: event-booking

spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: event-booking-api

  template:
    metadata:
      labels:
        app: event-booking-api

    spec:
      terminationGracePeriodSeconds: 45

      containers:
        - name: event-booking-api

          image: event-booking-api:1.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: loadtest

          envFrom:
            - configMapRef:
                name: event-booking-config

            - secretRef:
                name: event-booking-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080

            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3