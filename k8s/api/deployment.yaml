apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-booking-api
  namespace: event-booking

spec:
  replicas: 3

  selector:
    matchLabels:
      app: event-booking-api

  template:
    metadata:
      labels:
        app: event-booking-api

    spec:
      containers:
        - name: event-booking-api

          image: event-booking-api:1.0.4

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: event-booking-config

            - secretRef:
                name: event-booking-secret